<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon PC - Configuration</title>
<style>
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
:root{--bg:#07080d;--card:#10131b;--line:#232a3a;--txt:#eef1f8;--mut:#8a93aa;--a1:#7c5cff;--a2:#22d3ee;--a3:#f472b6}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);line-height:1.5;overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.05;background:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px)}
#net{position:fixed;inset:0;z-index:0}
.blobs i{position:fixed;border-radius:50%;filter:blur(90px);opacity:.35;z-index:0;animation:float 18s ease-in-out infinite alternate}
.blobs i:nth-child(1){width:46vw;height:46vw;background:var(--a1);top:-12vw;left:-10vw}
.blobs i:nth-child(2){width:38vw;height:38vw;background:var(--a2);bottom:-12vw;right:-8vw;animation-duration:22s}
.blobs i:nth-child(3){width:26vw;height:26vw;background:var(--a3);top:40vh;left:45vw;opacity:.18;animation-duration:26s}
@keyframes float{to{transform:translate(8vw,6vh) scale(1.2) rotate(40deg)}}
#pg{position:fixed;top:0;left:0;height:3px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--a1),var(--a2),var(--a3));z-index:100;box-shadow:0 0 12px var(--a2)}
#cur{position:fixed;top:0;left:0;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;pointer-events:none;z-index:1;background:radial-gradient(circle,rgba(124,92,255,.18),transparent 65%)}
.hero{position:relative;z-index:2;max-width:1150px;margin:0 auto;padding:90px 20px 40px}
.eyebrow{display:flex;align-items:center;gap:12px;color:var(--a2);text-transform:uppercase;letter-spacing:.3em;font-size:.78rem;font-weight:600;margin-bottom:18px}
.eyebrow::before{content:"";height:1px;width:0;background:var(--a2);animation:grow 1.2s .3s forwards;box-shadow:0 0 8px var(--a2)}
@keyframes grow{to{width:60px}}
h1{position:relative;display:inline-block;font-size:clamp(2.4rem,8vw,5.6rem);font-weight:800;letter-spacing:-.03em;line-height:1.05;background:linear-gradient(90deg,var(--a1),var(--a2),var(--a3),var(--a1));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 7s linear infinite,focus 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes flow{to{background-position:300% 0}}
@keyframes focus{from{filter:blur(24px);letter-spacing:.25em;opacity:0}}
h1::before,h1::after{content:attr(data-t);position:absolute;inset:0;background:inherit;-webkit-background-clip:text;background-clip:text;opacity:0}
h1::before{animation:g1 5s infinite}
h1::after{animation:g2 5s .15s infinite}
@keyframes g1{0%,92%,100%{opacity:0}93%{opacity:1;transform:translate(-6px,1px);clip-path:inset(8% 0 62% 0)}96%{opacity:1;transform:translate(5px,-2px);clip-path:inset(60% 0 12% 0)}}
@keyframes g2{0%,92%,100%{opacity:0}94%{opacity:1;transform:translate(6px,2px);clip-path:inset(40% 0 35% 0)}97%{opacity:1;transform:translate(-4px,0);clip-path:inset(75% 0 5% 0)}}
.sub{margin-top:18px;color:var(--mut);font-size:1.15rem;min-height:1.7em;font-family:ui-monospace,Menlo,Consolas,monospace}
.sub::after{content:"";display:inline-block;width:9px;height:1.1em;margin-left:4px;vertical-align:-3px;background:var(--a2);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.orb{position:absolute;right:20px;top:40px;width:260px;height:260px;pointer-events:none}
.orb i{position:absolute;inset:0;border-radius:50%;border:1px dashed rgba(124,92,255,.5);animation:rot 20s linear infinite}
.orb i:nth-child(2){inset:30px;border-color:rgba(34,211,238,.5);animation-duration:13s;animation-direction:reverse}
.orb i:nth-child(3){inset:62px;border:1px solid rgba(244,114,182,.4);animation-duration:8s}
.orb i::after{content:"";position:absolute;top:-4px;left:50%;width:8px;height:8px;border-radius:50%;background:var(--a2);box-shadow:0 0 14px 3px var(--a2)}
@keyframes rot{to{transform:rotate(360deg)}}
@media(max-width:800px){.orb{display:none}}
.marquee{position:relative;z-index:2;overflow:hidden;border-block:1px solid var(--line);background:rgba(16,19,27,.6);backdrop-filter:blur(6px);margin:20px 0 10px;mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.track{display:flex;width:max-content;animation:mq 45s linear infinite}
.marquee:hover .track{animation-play-state:paused}
.track span{padding:14px 28px;white-space:nowrap;color:var(--mut);font-size:.92rem;text-transform:uppercase;letter-spacing:.12em}
.track span::after{content:"";display:inline-block;width:7px;height:7px;margin-left:56px;background:var(--a1);transform:rotate(45deg);box-shadow:0 0 10px var(--a1)}
@keyframes mq{to{transform:translateX(-50%)}}
.wrap{position:relative;z-index:2;max-width:1150px;margin:0 auto;padding:20px 20px 70px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:26px 0}
.stat{position:relative;overflow:hidden;background:rgba(16,19,27,.75);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:18px;opacity:0;translate:0 30px;transition:opacity .7s,translate .7s cubic-bezier(.2,.8,.2,1),border-color .3s}
.stat.in{opacity:1;translate:0 0}
.stat:hover{border-color:var(--a2)}
.stat::before{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.1),transparent);transform:skewX(-20deg);transition:left .8s}
.stat:hover::before{left:130%}
.stat b{display:block;font-size:1.65rem;font-variant-numeric:tabular-nums;background:linear-gradient(90deg,#fff,var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{color:var(--mut);font-size:.85rem}
.bar{margin-bottom:16px}
.bar input{width:100%;padding:14px 18px;border-radius:14px;border:1px solid var(--line);background:rgba(16,19,27,.8);color:var(--txt);font-size:1rem;outline:none;transition:border-color .3s,box-shadow .3s}
.bar input:focus{border-color:var(--a1);box-shadow:0 0 0 4px rgba(124,92,255,.2),0 0 30px rgba(124,92,255,.3)}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px}
.chip{position:relative;overflow:hidden;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:rgba(16,19,27,.8);color:var(--txt);cursor:pointer;font-size:.9rem;transition:transform .25s,border-color .25s,box-shadow .25s}
.chip:hover{transform:translateY(-3px);border-color:var(--a2)}
.chip.on{background:linear-gradient(90deg,var(--a1),var(--a2),var(--a1));background-size:200% 100%;border-color:transparent;color:#fff;box-shadow:0 0 22px rgba(124,92,255,.55);animation:flow2 3s linear infinite}
@keyframes flow2{to{background-position:200% 0}}
.chip i{position:absolute;border-radius:50%;background:rgba(255,255,255,.4);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:18px;transition:opacity .18s}
.card{--mx:50%;--my:50%;position:relative;display:flex;flex-direction:column;gap:10px;padding:22px;border-radius:20px;background:var(--card);border:1px solid var(--line);opacity:0;overflow:hidden;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out,translate .3s,box-shadow .3s}
.card.in{opacity:1;animation:rise .9s cubic-bezier(.2,.8,.2,1) var(--d,0s) backwards}
@keyframes rise{from{opacity:0;translate:0 60px;filter:blur(10px);scale:.94}}
.card:hover{translate:0 -6px;box-shadow:0 20px 50px -15px rgba(124,92,255,.5)}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;background:conic-gradient(from var(--ang),transparent 0 60%,var(--a2),var(--a1),var(--a3),transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .3s;animation:spin 3s linear infinite}
.card:hover::before{opacity:1}
@keyframes spin{to{--ang:360deg}}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(380px circle at var(--mx) var(--my),rgba(124,92,255,.22),transparent 60%)}
.card:hover::after{opacity:1}
.idx{position:absolute;right:16px;top:6px;font-size:3.6rem;font-weight:800;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(138,147,170,.25);transition:-webkit-text-stroke-color .3s,transform .4s;pointer-events:none}
.card:hover .idx{-webkit-text-stroke-color:var(--a2);transform:scale(1.15) translateX(-6px)}
.tag{font-size:.74rem;text-transform:uppercase;letter-spacing:.14em;color:var(--a2);font-weight:700;display:flex;align-items:center;gap:8px}
.tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--a2);box-shadow:0 0 10px var(--a2);animation:pulse 2s infinite}
@keyframes pulse{50%{transform:scale(1.7);opacity:.4}}
.name{font-size:1.15rem;font-weight:700;padding-right:56px;line-height:1.3}
.det{color:var(--mut);font-size:.9rem}
.pbar{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}
.pbar b{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--a1),var(--a2),var(--a3));background-size:200% 100%;transition:width 1.4s .5s cubic-bezier(.2,.8,.2,1);animation:flow2 3s linear infinite}
.card.in .pbar b{width:var(--w)}
.meta{display:grid;grid-template-columns:1fr auto auto;gap:16px;margin-top:auto;padding-top:14px;border-top:1px solid var(--line);font-size:.85rem}
.meta small{display:block;color:var(--mut);font-size:.68rem;text-transform:uppercase;letter-spacing:.1em}
.price{font-weight:800;color:var(--txt)}
a.lnk{color:var(--a2);text-decoration:none;font-weight:700;background:linear-gradient(var(--a2),var(--a2)) 0 100%/0 1px no-repeat;transition:background-size .3s,letter-spacing .3s}
a.lnk:hover{background-size:100% 1px;letter-spacing:.03em}
.na{opacity:.6}
.empty{color:var(--mut);padding:40px;text-align:center}
footer{margin-top:50px;text-align:center;color:var(--mut);font-size:.85rem}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="net"></canvas>
<div class="blobs"><i></i><i></i><i></i></div>
<div id="pg"></div>
<div id="cur"></div>

<header class="hero">
  <div class="orb"><i></i><i></i><i></i></div>
  <p class="eyebrow">Configuration personnelle</p>
  <h1 data-t="Ma configuration PC">Ma configuration PC</h1>
  <p class="sub" id="type"></p>
</header>
<div class="marquee"><div class="track" id="track"></div></div>

<main class="wrap">
  <div class="stats" id="stats"></div>
  <div class="bar"><input id="q" type="search" placeholder="Rechercher un composant, une marque..."></div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
  <footer>Derniere mise a jour : <span id="upd"></span></footer>
</main>

<script>
/* ============================================================
   MODIFIE ICI : pour ajouter un lien, remplis "url" avec
   l'adresse du produit (ex: "https://www.amazon.fr/..."),
   pour ajouter un composant, copie une ligne.
   prix : nombre (ex: 140) ou null si inconnu.
   ============================================================ */
const PARTS = [
  {cat:"Cœur du PC", composant:"Carte mère", modele:"PRIME B760-PLUS D4", specs:"ATX, DDR4", date:"6 mai 2026", url:"https://www.amazon.fr/dp/B0BNQDVLGN", prix:140},
  {cat:"Cœur du PC", composant:"Processeur", modele:"Intel Core™ i5-12400F", specs:"8 Mo de cache, jusqu'à 4,40 GHz", date:"6 mai 2026", url:"https://www.amazon.fr/dp/B09NPJRDGD", prix:179.99},
  {cat:"Cœur du PC", composant:"RAM", modele:"Corsair Vengeance RGB Pro 64 Go (2x32 Go) DDR4 3600", specs:"DDR4, 64 Go (2x32 Go), 3600 MHz, CAS 18, RGB, PC4-28800", date:"10 décembre 2023", url:"https://www.amazon.fr/dp/B081BTFN1B", prix:189.53},
  {cat:"Cœur du PC", composant:"Carte graphique", modele:"KFA2 GeForce RTX 3060 Ti", specs:"NVIDIA RTX 3060 Ti, 8 Go GDDR6, LHR, PCIe 4.0, refroidissement double ventilateur", date:"16 mai 2023", url:"https://www.amazon.fr/dp/B0BNL4LV1H", prix:333.09},

  {cat:"Stockage", composant:"Stockage HDD", modele:"Seagate BarraCuda 2 To (ST2000DM005)", specs:"HDD 2 To, 7200 RPM, SATA III, cache 256 Mo", date:"16 mai 2023", url:"https://www.ldlc.com/fiche/PB00254339.html", lienTexte:"Plus dispo", prix:52.46},
  {cat:"Stockage", composant:"Stockage SSD", modele:"Kingston FURY Renegade 500 Go", specs:"SSD NVMe M.2, 500 Go, PCIe Gen 4, jusqu'à 7300 Mo/s en lecture", date:"16 mai 2023", url:"https://www.amazon.fr/dp/B09K3NNGDS", prix:74.91},

  {cat:"Boîtier & refroidissement", composant:"Alimentation", modele:"CORSAIR RM1000e (2025)", specs:"ATX entièrement modulaire 12V-2x6, compatible ATX 3.1 et PCIe 5.1, Cybenetics Gold, condensateurs 105°C, noir", date:"12 avril 2026", url:"https://www.amazon.fr/dp/B0DMTN57C1", prix:119},
  {cat:"Boîtier & refroidissement", composant:"Ventilateurs", modele:"CORSAIR RS120 ARGB 120 mm (pack de 3)", specs:"120 mm, PWM, ARGB, faible bruit, roulement à dôme magnétique, Daisy-Chain, noir", date:"23 octobre 2025", url:"https://www.amazon.fr/dp/B0D49Q4CGM", prix:29.90},
  {cat:"Boîtier & refroidissement", composant:"Boîtier", modele:"Aerocool Cylon Pro Tempered Glass (Noir)", specs:"Moyen tour ATX, verre trempé, radiateur 240/360 mm, RGB, emplacements ventilateurs supplémentaires", date:"16 mai 2023", url:"https://www.ldlc.com/fiche/PB00272502.html", lienTexte:"Plus dispo", prix:70.79},

  {cat:"Périphériques", composant:"Souris", modele:"Razer Cobra – Gengar Edition", specs:"Souris gaming, capteur optique haute précision, RGB, 800 DPI", date:"12 octobre 2025", url:"https://www.amazon.fr/dp/B0FPG9GFTV", prix:69.99},
  {cat:"Périphériques", composant:"Clavier", modele:"Trust AVONN GXT 830-RW", specs:"Clavier gaming, rétroéclairage RGB, filaire, touches multimédia", date:"Il y a bien longtemps", url:"https://www.amazon.fr/dp/B0779BY6RQ", prix:null},
  {cat:"Périphériques", composant:"Casque", modele:"Razer Kraken V3", specs:"USB filaire, Chroma RGB, haut-parleurs TriForce 50 mm, son spatial THX, micro cardioïde HyperClear amovible, noir", date:"5 décembre 2025", url:"https://www.amazon.fr/dp/B09D439KLX", prix:69.99},

  {cat:"Écrans", composant:"Écran 1", modele:"TCL 24G645 QD-Mini LED", specs:"24\", 300 Hz, Full HD, noir et gris", date:"11 janvier 2026", url:"https://www.fnac.com/Ecran-PC-gaming-QD-Mini-LED-Tcl-24G645-24-300-Hz-Full-HD-Noir-et-Gris/a21582322/w-4", prix:249.99},
  {cat:"Écrans", composant:"Écran 2", modele:"PGM 270", specs:"144 Hz", date:"Il y a bien longtemps", url:"", lienTexte:"Pas de lien", prix:null},
  {cat:"Écrans", composant:"Écran 3", modele:"HP", specs:"60 Hz", date:"Il y a bien longtemps", url:"", lienTexte:"Pas de lien", prix:null},
];
const LAST_UPDATE = "14 octobre 2026";

const $=id=>document.getElementById(id);
const fine=matchMedia("(pointer:fine)").matches, calm=matchMedia("(prefers-reduced-motion:reduce)").matches;
const eur=n=>n.toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" EUR".replace("EUR","\u20AC");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const maxP=Math.max(...PARTS.map(p=>p.prix||0));
let cat="Tout";
const cats=["Tout",...new Set(PARTS.map(p=>p.cat))];

/* ---------- effets utilitaires ---------- */
function scramble(el,txt){const ch="ABCDEF0123456789#%&";let f=0;const t=setInterval(()=>{el.textContent=txt.split("").map((c,i)=>c===" "||i<f/2?c:ch[Math.random()*ch.length|0]).join("");if(++f>txt.length*2+4){el.textContent=txt;clearInterval(t)}},35)}
function count(el,to,fmt){const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/1600),e=1-Math.pow(1-p,4);el.textContent=fmt(to*e);if(p<1)requestAnimationFrame(f)})(t0)}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const el=e.target;el.classList.add("in");io.unobserve(el);
  const b=el.querySelector("b[data-n]");if(b)count(b,+b.dataset.n,b.dataset.f==="eur"?eur:n=>Math.round(n));
  const s=el.querySelector("b[data-s]");if(s)scramble(s,s.dataset.s)}),{threshold:.15});

/* ---------- hero : machine a ecrire ---------- */
(function(){const w=["Intel Core i5-12400F","NVIDIA RTX 3060 Ti","64 Go de DDR4 RGB","3 ecrans dont un 300 Hz","Alimentation 1000 W modulaire"],el=$("type");let i=0,j=0,del=false;
(function tick(){const s=w[i];el.textContent=s.slice(0,j);if(!del&&j===s.length){del=true;return setTimeout(tick,1600)}if(del&&j===0){del=false;i=(i+1)%w.length}j+=del?-1:1;setTimeout(tick,del?28:65)})()})();

/* ---------- bandeau defilant ---------- */
$("track").innerHTML=[...PARTS,...PARTS].map(p=>`<span>${esc(p.modele)}</span>`).join("");

/* ---------- stats ---------- */
(function(){const total=PARTS.reduce((s,p)=>s+(p.prix||0),0),known=PARTS.filter(p=>p.prix!=null).length;
const S=[{n:PARTS.length,f:"int",l:"composants"},{n:total,f:"eur",l:`valeur connue (${known}/${PARTS.length} prix)`},{s:"i5-12400F",l:"processeur"},{s:"RTX 3060 Ti",l:"carte graphique"},{s:"64 Go DDR4",l:"memoire vive"}];
$("stats").innerHTML=S.map((x,i)=>`<div class="stat" style="transition-delay:${i*90}ms"><b ${x.s?`data-s="${x.s}"`:`data-n="${x.n}" data-f="${x.f}"`}>&nbsp;</b><span>${esc(x.l)}</span></div>`).join("");
document.querySelectorAll(".stat").forEach(e=>io.observe(e))})();

/* ---------- filtres ---------- */
function chips(){$("chips").innerHTML=cats.map(c=>`<button class="chip ${c===cat?"on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
$("chips").querySelectorAll(".chip").forEach(b=>b.onclick=e=>{
  const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),i=document.createElement("i");
  i.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(i);
  cat=b.dataset.c;chips();$("grid").style.opacity=0;setTimeout(()=>{render();$("grid").style.opacity=1},180)})}

/* ---------- cartes ---------- */
function render(){
  const q=$("q").value.trim().toLowerCase();
  const list=PARTS.map((p,i)=>({p,i})).filter(({p})=>(cat==="Tout"||p.cat===cat)&&(!q||[p.composant,p.modele,p.specs,p.date].join(" ").toLowerCase().includes(q)));
  if(!list.length){$("grid").innerHTML=`<div class="empty">Aucun resultat.</div>`;return}
  $("grid").innerHTML=list.map(({p,i},k)=>{
    const link=p.url?`<a class="lnk" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">Voir le produit &#8599;</a>${p.lienTexte?` <span class="na">(${esc(p.lienTexte.toLowerCase())})</span>`:""}`:`<span class="na">${esc(p.lienTexte||"Lien a ajouter")}</span>`;
    return `<article class="card" style="--d:${(k%3)*110}ms;--w:${p.prix?Math.max(6,p.prix/maxP*100):0}%">
      <span class="idx">${String(i+1).padStart(2,"0")}</span>
      <span class="tag">${esc(p.composant)}</span>
      <div class="name">${esc(p.modele)}</div>
      <div class="det">${esc(p.specs)}</div>
      <div class="pbar"><b></b></div>
      <div class="meta"><div><small>Achat</small>${esc(p.date)}</div><div><small>Prix</small><span class="price">${p.prix!=null?eur(p.prix):"Inconnu"}</span></div><div><small>Lien</small>${link}</div></div>
    </article>`}).join("");
  document.querySelectorAll(".card").forEach(c=>{io.observe(c);
    c.addEventListener("pointerleave",()=>{c.style.setProperty("--rx","0deg");c.style.setProperty("--ry","0deg")})});
}
$("grid").addEventListener("pointermove",e=>{const c=e.target.closest(".card");if(!c)return;
  const r=c.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;
  c.style.setProperty("--mx",px*100+"%");c.style.setProperty("--my",py*100+"%");
  if(fine&&!calm){c.style.setProperty("--rx",(.5-py)*10+"deg");c.style.setProperty("--ry",(px-.5)*12+"deg")}});
$("q").addEventListener("input",render);

/* ---------- barre de progression + halo curseur ---------- */
addEventListener("scroll",()=>{$("pg").style.transform=`scaleX(${scrollY/(document.body.scrollHeight-innerHeight||1)})`},{passive:true});
(function(){if(!fine||calm){$("cur").remove();return}let tx=innerWidth/2,ty=innerHeight/2,x=tx,y=ty;
addEventListener("mousemove",e=>{tx=e.clientX;ty=e.clientY});
(function f(){x+=(tx-x)*.12;y+=(ty-y)*.12;$("cur").style.transform=`translate(${x}px,${y}px)`;requestAnimationFrame(f)})()})();

/* ---------- reseau de particules ---------- */
(function(){if(calm)return;const c=$("net"),g=c.getContext("2d");let W,H,P=[],m={x:-999,y:-999};
function rs(){W=c.width=innerWidth;H=c.height=innerHeight;P=Array.from({length:Math.min(90,W*H/16000|0)},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4}))}
addEventListener("resize",rs);addEventListener("mousemove",e=>{m.x=e.clientX;m.y=e.clientY});rs();
function line(a,b,x2,y2,col){g.strokeStyle=col;g.beginPath();g.moveTo(a,b);g.lineTo(x2,y2);g.stroke()}
(function loop(){g.clearRect(0,0,W,H);
  for(const p of P){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;g.fillStyle="rgba(34,211,238,.7)";g.beginPath();g.arc(p.x,p.y,1.5,0,6.3);g.fill()}
  for(let i=0;i<P.length;i++){const a=P[i];
    for(let j=i+1;j<P.length;j++){const b=P[j],dx=a.x-b.x,dy=a.y-b.y,d=dx*dx+dy*dy;if(d<14000)line(a.x,a.y,b.x,b.y,`rgba(124,92,255,${.3*(1-d/14000)})`)}
    const dx=a.x-m.x,dy=a.y-m.y,d=dx*dx+dy*dy;if(d<32000)line(a.x,a.y,m.x,m.y,`rgba(34,211,238,${.7*(1-d/32000)})`)}
  requestAnimationFrame(loop)})()})();

$("upd").textContent=LAST_UPDATE;
chips();render();
</script>
</body>
